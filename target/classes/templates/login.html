<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Electronic Voting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 400px;
            width: 100%;
        }
        .brand-logo {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .otp-section {
            display: none;
        }
        .otp-input {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 5px;
        }
        .tab-container {
            margin-bottom: 2rem;
        }
        .nav-tabs .nav-link {
            border-radius: 10px;
            margin-right: 10px;
            border: 1px solid #ddd;
            background: #f8f9fa;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .back-home:hover {
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left me-2"></i>Back to Home
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="fas fa-vote-yea brand-logo"></i>
                <h3 class="mb-2">Welcome Back</h3>
                <p class="text-muted">Login to access your voting account</p>
            </div>
            
            <!-- Alert Messages -->
            <div id="alertContainer" class="mb-3"></div>
            
            <!-- Tab Navigation -->
            <div class="tab-container">
                <ul class="nav nav-tabs nav-fill" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="voter-tab" data-bs-toggle="tab" data-bs-target="#voter-pane" type="button" role="tab">
                            <i class="fas fa-user me-2"></i>Voter
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-pane" type="button" role="tab">
                            <i class="fas fa-user-shield me-2"></i>Admin
                        </button>
                    </li>
                </ul>
            </div>
            
            <!-- Tab Content -->
            <div class="tab-content" id="authTabContent">
                <!-- Voter Login Tab -->
                <div class="tab-pane fade show active" id="voter-pane" role="tabpanel" aria-labelledby="voter-tab">
                    <form id="voterLoginForm">
                        <div class="mb-3">
                            <label for="voterEmail" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Email Address
                            </label>
                            <input type="email" class="form-control" id="voterEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="voterPassword" class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="voterPassword" required>
                        </div>
                        <button type="submit" class="btn btn-login text-white w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Login as Voter
                        </button>
                    </form>
                </div>
                
                <!-- Admin Login Tab -->
                <div class="tab-pane fade" id="admin-pane" role="tabpanel" aria-labelledby="admin-tab">
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label for="adminEmail" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Admin Email
                            </label>
                            <input type="email" class="form-control" id="adminEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control" id="adminPassword" required>
                        </div>
                        <button type="submit" class="btn btn-login text-white w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- OTP Verification Section -->
            <div class="otp-section" id="otpSection">
                <div class="text-center mb-3">
                    <i class="fas fa-key fa-2x text-primary"></i>
                    <h5 class="mt-2">Verify Your Account</h5>
                    <p class="text-muted small">Enter the OTP sent to your email</p>
                </div>
                <form id="otpVerificationForm">
                    <div class="mb-3">
                        <label for="otpCode" class="form-label">OTP Code</label>
                        <input type="text" class="form-control otp-input" id="otpCode" maxlength="6" required>
                        <div class="form-text">Enter the 6-digit code from your email</div>
                    </div>
                    <button type="submit" class="btn btn-login text-white w-100 mb-2">
                        <i class="fas fa-check me-2"></i>Verify OTP
                    </button>
                    <div class="text-center">
                        <button type="button" class="btn btn-link text-decoration-none" id="resendOtpBtn">
                            <i class="fas fa-redo me-1"></i>Resend OTP
                        </button>
                    </div>
                </form>
            </div>

            <!-- Password Setup Section -->
            <div class="otp-section" id="passwordSetupSection" style="display: none;">
                <div class="text-center mb-3">
                    <i class="fas fa-lock fa-2x text-primary"></i>
                    <h5 class="mt-2">Set Your Password</h5>
                    <p class="text-muted small">Create a password for your account</p>
                </div>
                <form id="passwordSetupForm">
                    <div class="mb-3">
                        <label for="setupPassword" class="form-label">
                            <i class="fas fa-lock me-2"></i>Password
                        </label>
                        <input type="password" class="form-control" id="setupPassword" required>
                        <div class="form-text">Password must be at least 6 characters long</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmSetupPassword" class="form-label">
                            <i class="fas fa-lock me-2"></i>Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmSetupPassword" required>
                    </div>
                    <button type="submit" class="btn btn-login text-white w-100 mb-2">
                        <i class="fas fa-save me-2"></i>Set Password
                    </button>
                    <div class="text-center">
                        <button type="button" class="btn btn-link text-decoration-none" id="backToOtpBtn">
                            <i class="fas fa-arrow-left me-1"></i>Back to OTP
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Registration Link -->
            <div class="text-center">
                <p class="text-muted small">
                    Don't have an account? 
                    <a href="/register" class="text-decoration-none fw-bold" style="color: #667eea;">
                        Register as Voter
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let pendingUserEmail = '';
        let isAdminLogin = false;
        
        // Utility functions
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
        
        function hideAlert() {
            document.getElementById('alertContainer').innerHTML = '';
        }
        
        function showOTPSection(email, admin = false) {
            pendingUserEmail = email;
            isAdminLogin = admin;

            // Hide login forms and show OTP section
            document.querySelector('.tab-container').style.display = 'none';
            document.querySelectorAll('.tab-pane').forEach(pane => pane.style.display = 'none');
            document.getElementById('otpSection').style.display = 'block';
            document.getElementById('passwordSetupSection').style.display = 'none';

            showAlert('OTP sent to your email. Please check your inbox and enter the code below.', 'info');
        }

        function showPasswordSetupSection() {
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('passwordSetupSection').style.display = 'block';
        }

        function showLoginSection() {
            document.querySelector('.tab-container').style.display = 'block';
            document.querySelectorAll('.tab-pane').forEach(pane => pane.style.display = 'block');
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('passwordSetupSection').style.display = 'none';
            pendingUserEmail = '';
            isAdminLogin = false;
        }
        
        // Form submissions
        document.getElementById('voterLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('voterEmail').value;
            const password = document.getElementById('voterPassword').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/voter/dashboard';
                    }, 1500);
                } else {
                    if (data.needsVerification) {
                        showOTPSection(email, false);
                    } else if (data.needsPasswordSetup) {
                        showAlert('Please set your password to continue.', 'info');
                        setTimeout(() => {
                            showPasswordSetupSection();
                        }, 1500);
                    } else {
                        showAlert(data.message || 'Login failed', 'danger');
                    }
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            }
        });
        
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showAlert('Admin login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Admin login failed', 'danger');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            }
        });
        
        document.getElementById('otpVerificationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();
            
            const otpCode = document.getElementById('otpCode').value;
            
            if (!pendingUserEmail) {
                showAlert('Please restart the login process', 'danger');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: pendingUserEmail, 
                        otpCode: otpCode 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    if (data.needsPasswordSetup) {
                        showAlert('OTP verified! Please set your password.', 'success');
                        setTimeout(() => {
                            showPasswordSetupSection();
                            document.getElementById('otpCode').value = '';
                        }, 1500);
                    } else {
                        showAlert('Account verified! Redirecting to login...', 'success');
                        setTimeout(() => {
                            showLoginSection();
                            // Clear forms
                            document.getElementById('voterEmail').value = '';
                            document.getElementById('voterPassword').value = '';
                            document.getElementById('adminEmail').value = '';
                            document.getElementById('adminPassword').value = '';
                            document.getElementById('otpCode').value = '';
                        }, 2000);
                    }
                } else {
                    showAlert(data.message || 'OTP verification failed', 'danger');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            }
        });
        
        document.getElementById('resendOtpBtn').addEventListener('click', async function() {
            if (!pendingUserEmail) return;

            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: pendingUserEmail })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('OTP resent successfully!', 'success');
                } else {
                    showAlert(data.message || 'Failed to resend OTP', 'danger');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            }
        });

        document.getElementById('passwordSetupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const password = document.getElementById('setupPassword').value;
            const confirmPassword = document.getElementById('confirmSetupPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long', 'danger');
                return;
            }

            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: pendingUserEmail,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('Password set successfully! You can now login.', 'success');
                    setTimeout(() => {
                        showLoginSection();
                        // Clear forms
                        document.getElementById('voterEmail').value = '';
                        document.getElementById('voterPassword').value = '';
                        document.getElementById('adminEmail').value = '';
                        document.getElementById('adminPassword').value = '';
                        document.getElementById('setupPassword').value = '';
                        document.getElementById('confirmSetupPassword').value = '';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Failed to set password', 'danger');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger');
            }
        });

        document.getElementById('backToOtpBtn').addEventListener('click', function() {
            showOTPSection(pendingUserEmail, isAdminLogin);
        });
        
        // Clear alerts when switching tabs
        document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', function() {
                hideAlert();
            });
        });
        
        // Auto-format OTP input
        document.getElementById('otpCode').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 6) value = value.substr(0, 6);
            e.target.value = value;
        });
        
        // Check for error messages from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const message = urlParams.get('message');
        
        if (error && message) {
            showAlert(decodeURIComponent(message), 'danger');
        }
        
        const logout = urlParams.get('logout');
        if (logout === 'true') {
            showAlert('You have been logged out successfully.', 'info');
        }
        
        const expired = urlParams.get('expired');
        if (expired === 'true') {
            showAlert('Your session has expired. Please log in again.', 'warning');
        }
    </script>
    
    <!-- Session Timeout Management -->
    <script src="/js/session-timeout.js"></script>
</body>
</html>

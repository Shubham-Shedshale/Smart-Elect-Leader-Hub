# Backup of original MSSQL configuration
# Microsoft SQL Server Configuration (Windows Authentication)
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=ELECTRONIC_VS;encrypt=false;trustServerCertificate=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true